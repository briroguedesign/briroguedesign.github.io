    <!-- ==========================================
         MOBILE NAV SCRIPT
    ========================================== -->

    <script>
        const navToggle = document.querySelector(".nav-toggle");
        const nav = document.querySelector(".nav");

        if (navToggle && nav) {
            navToggle.addEventListener("click", () => {
                const isOpen = nav.classList.toggle("nav-open");

                navToggle.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );
            });

            document.querySelectorAll(".nav-links a").forEach(link => {
                link.addEventListener("click", () => {
                    nav.classList.remove("nav-open");
                    navToggle.setAttribute("aria-expanded", "false");
                });
            });
        }
        
/* PHOTOGRAPHY LIGHTBOX */

const galleryImages = Array.from(
    document.querySelectorAll(".photo-gallery-item img")
);

const lightbox = document.getElementById("photoLightbox");
const lightboxImage = lightbox.querySelector(".lightbox-image");
const lightboxCounter = lightbox.querySelector(".lightbox-counter");

let currentPhoto = 0;
let previousFocus = null;

function showPhoto(index) {
    currentPhoto = (index + galleryImages.length) % galleryImages.length;

    const selected = galleryImages[currentPhoto];

    lightboxImage.src = selected.src;
    lightboxImage.alt = selected.alt;

    lightboxCounter.textContent =
        `${currentPhoto + 1} / ${galleryImages.length}`;
}

function openPhoto(index) {
    previousFocus = document.activeElement;
    showPhoto(index);

    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    lightbox.querySelector(".lightbox-close").focus();
}

function closePhoto() {
    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");
    lightboxImage.removeAttribute("src");
    document.body.style.overflow = "";
    if (previousFocus) previousFocus.focus();
}

galleryImages.forEach((img, index) => {
    img.setAttribute("tabindex", "0");
    img.setAttribute("role", "button");
    img.setAttribute("aria-label", `Enlarge photo ${index + 1}`);

    img.addEventListener("click", () => openPhoto(index));

    img.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openPhoto(index);
        }
    });
});

lightbox.querySelector(".lightbox-close")
    .addEventListener("click", closePhoto);

lightbox.querySelector(".lightbox-prev")
    .addEventListener("click", () => showPhoto(currentPhoto - 1));

lightbox.querySelector(".lightbox-next")
    .addEventListener("click", () => showPhoto(currentPhoto + 1));

lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) closePhoto();
});

document.addEventListener("keydown", (event) => {
    if (!lightbox.classList.contains("is-open")) return;

    if (event.key === "Escape") closePhoto();
    if (event.key === "ArrowLeft") showPhoto(currentPhoto - 1);
    if (event.key === "ArrowRight") showPhoto(currentPhoto + 1);

    if (event.key === "Tab") {
        const controls = [
            lightbox.querySelector(".lightbox-close"),
            lightbox.querySelector(".lightbox-prev"),
            lightbox.querySelector(".lightbox-next")
        ];
        const index = controls.indexOf(document.activeElement);
        if (event.shiftKey && index <= 0) {
            event.preventDefault();
            controls[controls.length - 1].focus();
        } else if (!event.shiftKey && index === controls.length - 1) {
            event.preventDefault();
            controls[0].focus();
        }
    }
});

    </script>
